<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <style>
        form {
            border: 1px dashed;
            height: 220px;
            width: 350px;
            margin: auto;
            background-color: rgb(238, 189, 255);
        }
    </style>
</head>

<body>
    <div align="center">
        <form action="passchanged.html">
            <h1>Account Found</h1>
            <label for="">Change Password:</label>
            <input type="password" placeholder="Enter New Passport">
            <br><br>
            <label for="">Confirm Password:</label>
            <input type="password" placeholder="Confirm Password">
            <br><br>
            <input type="submit" value="Change Password">
            <input type="reset" value="Reset">
        </form>
    </div>
</body>

</html>
